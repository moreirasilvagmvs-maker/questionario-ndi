<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionário NDI</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:1rem}
.header{text-align:center;padding:1.4rem 1rem 1rem;background:#fff;border-radius:14px;margin-bottom:1rem;border:1px solid #e5e5e5}
.header h1{font-size:17px;font-weight:600;line-height:1.4;color:#1a1a1a}
.header p{font-size:13px;color:#666;margin-top:4px}
.project-logo{width:90px;height:90px;object-fit:contain;margin-bottom:8px;border-radius:50%}
.progress-text{font-size:12px;color:#888;text-align:right;margin-bottom:4px}
.progress-bar{height:5px;background:#e5e5e5;border-radius:5px;margin-bottom:1rem}
.progress-fill{height:5px;background:#534AB7;border-radius:5px;transition:width 0.3s}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:1.1rem 1.2rem;margin-bottom:1rem}
.section-num{font-size:11px;font-weight:600;color:#534AB7;letter-spacing:0.5px;margin-bottom:4px;text-transform:uppercase}
.section-title{font-size:15px;font-weight:600;color:#1a1a1a;margin-bottom:14px}
.option{display:flex;align-items:flex-start;gap:10px;padding:10px;border-radius:10px;cursor:pointer;margin-bottom:4px;border:1px solid transparent;transition:background 0.15s,border-color 0.15s}
.option:hover{background:#f0f0f0}
.option.selected{background:#EEEDFE;border-color:#AFA9EC}
.option input[type=radio]{margin-top:2px;accent-color:#534AB7;min-width:18px;height:18px;cursor:pointer}
.option label{font-size:14px;color:#1a1a1a;cursor:pointer;line-height:1.5}
.option.selected label{color:#3C3489}
.name-input{width:100%;padding:11px 14px;border-radius:10px;border:1px solid #ddd;font-size:15px;color:#1a1a1a;background:#fff;margin-bottom:1rem;-webkit-appearance:none}
.name-input:focus{outline:none;border-color:#534AB7}
.nav-btns{display:flex;gap:8px;margin-top:0.5rem}
.btn{flex:1;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:1px solid #ddd;background:#fff;color:#1a1a1a;transition:background 0.15s;-webkit-tap-highlight-color:transparent}
.btn:hover,.btn:active{background:#f0f0f0}
.btn-primary{background:#534AB7;color:#fff;border-color:#534AB7}
.btn-primary:hover,.btn-primary:active{background:#3C3489;border-color:#3C3489}
.btn:disabled{opacity:0.35;cursor:not-allowed}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:1rem}
.metric{background:#fff;border-radius:10px;padding:14px;text-align:center;border:1px solid #e5e5e5}
.metric-val{font-size:28px;font-weight:700;color:#534AB7}
.metric-lbl{font-size:12px;color:#888;margin-top:3px}
.result-class{font-size:16px;font-weight:600;padding:12px 16px;border-radius:10px;text-align:center;margin-bottom:1rem}
.class-none{background:#f0f0f0;color:#333}
.class-leve{background:#EAF3DE;color:#27500A}
.class-moderada{background:#FAEEDA;color:#633806}
.class-severa{background:#FAECE7;color:#4A1B0C}
.class-completa{background:#FCEBEB;color:#501313}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-lbl{font-size:11px;color:#888;width:56px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:14px;background:#f0f0f0;border-radius:4px;overflow:hidden}
.bar-fill{height:14px;border-radius:4px}
.bar-pts{font-size:11px;color:#888;width:22px;flex-shrink:0}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f0f0;font-size:13px}
.detail-row:last-child{border-bottom:none}
.legend{display:flex;gap:12px;font-size:11px;color:#888;margin-top:8px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:4px}
.leg-dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.save-img-btn{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;border:none;background:#534AB7;color:#fff;margin-bottom:8px;-webkit-tap-highlight-color:transparent}
.save-img-btn:active{background:#3C3489}
.save-img-btn:disabled{opacity:0.5;cursor:not-allowed}
.restart-btn{width:100%;padding:12px;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer;border:1px solid #ddd;background:#fff;color:#333;-webkit-tap-highlight-color:transparent}
.restart-btn:active{background:#f0f0f0}
.msg-box{text-align:center;font-size:13px;border-radius:10px;padding:10px;margin-bottom:8px;display:none}
.msg-ok{color:#27500A;background:#EAF3DE}
.msg-err{color:#501313;background:#FCEBEB}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.88);z-index:999;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.overlay.show{display:flex}
.spinner{width:38px;height:38px;border:3px solid #e5e5e5;border-top-color:#534AB7;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:14px;color:#534AB7;font-weight:600}
.fb-badge{display:inline-flex;align-items:center;gap:5px;background:#FFF3E0;color:#E65100;font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;margin-top:6px}
.fb-dot{width:7px;height:7px;border-radius:50%;background:#4CAF50;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.quiz-logo-bar{text-align:center;margin-bottom:0.6rem}
.quiz-logo-bar img{width:60px;height:60px;object-fit:contain;border-radius:50%}
</style>
</head>
<body>

<div class="overlay" id="loading">
  <div class="spinner"></div>
  <div class="loading-txt" id="loading-txt">Enviando para nuvem...</div>
</div>

<div class="wrap" id="app"></div>

// Firestore REST API - sem dependencia de biblioteca externa (compativel com iPhone)
var FIRESTORE_PROJECT = "ndi-questionario";
var FIRESTORE_API_KEY = "AIzaSyCr8yIYajfzvgLD02WjsHHUnb-cJBOyKyY";
var FIRESTORE_URL = "https://firestore.googleapis.com/v1/projects/" + FIRESTORE_PROJECT + "/databases/(default)/documents/resultados_ndi?key=" + FIRESTORE_API_KEY;

function toFirestoreValue(val) {
  if (val === null || val === undefined) return { nullValue: null };
  if (typeof val === 'boolean') return { booleanValue: val };
  if (typeof val === 'number') return { integerValue: String(val) };
  if (typeof val === 'string') return { stringValue: val };
  if (typeof val === 'object') {
    var fields = {};
    Object.keys(val).forEach(function(k) { fields[k] = toFirestoreValue(val[k]); });
    return { mapValue: { fields: fields } };
  }
  return { stringValue: String(val) };
}

window.salvarNoFirebase = function(dadosResultado) {
  var fields = {};
  Object.keys(dadosResultado).forEach(function(k) {
    fields[k] = toFirestoreValue(dadosResultado[k]);
  });
  fields['timestamp'] = { timestampValue: new Date().toISOString() };
  var body = JSON.stringify({ fields: fields });
  return fetch(FIRESTORE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: body
  }).then(function(r) {
    return r.ok;
  }).catch(function(e) {
    console.error("Erro ao salvar:", e);
    return false;
  });
};

{id:1,title:"Intensidade da dor",options:["Eu nao tenho dor nesse momento.","A dor e muito leve nesse momento.","A dor e moderada nesse momento.","A dor e razoavelmente grande nesse momento.","A dor e muito grande nesse momento.","A dor e a pior que se possa imaginar nesse momento."],na:false},
{id:2,title:"Cuidado pessoal (se lavar, se vestir, etc)",options:["Eu posso cuidar de mim mesmo(a) sem aumentar a dor.","Eu posso cuidar de mim mesmo(a) normalmente, mas isso faz aumentar a dor.","E doloroso ter que cuidar de mim mesmo e eu faco isso lentamente e com cuidado.","Eu preciso de ajuda mas consigo fazer a maior parte do meu cuidado pessoal.","Eu preciso de ajuda todos os dias na maioria dos aspectos relacionados a cuidar de mim mesmo(a).","Eu nao me visto, me lavo com dificuldade e fico na cama."],na:false},
{id:3,title:"Levantar coisas",options:["Eu posso levantar objetos pesados sem aumentar a dor.","Eu posso levantar objetos pesados mas isso faz aumentar a dor.","A dor me impede de levantar objetos pesados do chao, mas consigo se estiverem em boa posicao.","A dor me impede de levantar objetos pesados, mas consigo levantar peso leve a medio em boa posicao.","Eu posso levantar objetos muito leves.","Eu nao posso levantar nem carregar absolutamente nada."],na:false},
{id:4,title:"Leitura",options:["Eu posso ler tanto quanto eu queira sem dor no meu pescoco.","Eu posso ler tanto quanto eu queira com uma dor leve no meu pescoco.","Eu posso ler tanto quanto eu queira com uma dor moderada no meu pescoco.","Eu nao posso ler tanto quanto eu queira por causa de dor moderada no meu pescoco.","Eu mal posso ler por causa de uma grande dor no meu pescoco.","Eu nao posso ler nada."],na:true,naText:"Nao se aplica - nao sabe ou nao pode ler."},
{id:5,title:"Dores de cabeca",options:["Eu nao tenho nenhuma dor de cabeca.","Eu tenho pequenas dores de cabeca com pouca frequencia.","Eu tenho dores de cabeca moderadas com pouca frequencia.","Eu tenho dores de cabeca moderadas muito frequentemente.","Eu tenho dores de cabeca fortes frequentemente.","Eu tenho dores de cabeca quase o tempo inteiro."],na:false},
{id:6,title:"Prestar atencao",options:["Eu consigo prestar atencao quando eu quero sem dificuldade.","Eu consigo prestar atencao quando eu quero com dificuldade leve.","Eu tenho dificuldade moderada em prestar atencao quando eu quero.","Eu tenho muita dificuldade em prestar atencao quando eu quero.","Eu tenho muitissima dificuldade em prestar atencao quando eu quero.","Eu nao consigo prestar atencao."],na:false},
{id:7,title:"Trabalho",options:["Eu posso trabalhar tanto quanto eu quiser.","Eu so consigo fazer o trabalho que estou acostumado(a), mas nada alem disso.","Eu consigo fazer a maior parte do trabalho que estou acostumado(a), mas nada alem.","Eu nao consigo fazer o trabalho que estou acostumado(a) a fazer.","Eu mal consigo fazer qualquer tipo de trabalho.","Eu nao consigo fazer nenhum tipo de trabalho."],na:false},
{id:8,title:"Dirigir automoveis",options:["Eu posso dirigir meu carro sem nenhuma dor no pescoco.","Eu posso dirigir meu carro tanto quanto eu queira com dor leve no pescoco.","Eu posso dirigir meu carro tanto quanto eu queira com dor moderada no pescoco.","Eu nao posso dirigir tanto quanto queira por causa de dor moderada no pescoco.","Eu mal posso dirigir por causa de uma dor forte no meu pescoco.","Eu nao posso dirigir meu carro de maneira nenhuma."],na:true,naText:"Nao se aplica - nao sabe dirigir ou nao dirige."},
{id:9,title:"Dormir",options:["Eu nao tenho problemas para dormir.","Meu sono e um pouco perturbado (menos de 1h sem conseguir dormir).","Meu sono e levemente perturbado (1-2h sem conseguir dormir).","Meu sono e moderadamente perturbado (2-3h sem conseguir dormir).","Meu sono e muito perturbado (3-5h sem conseguir dormir).","Meu sono e completamente perturbado (5-7h sem sono)."],na:false},
{id:10,title:"Diversao",options:["Eu consigo fazer todas as minhas atividades de diversao sem dor no pescoco.","Eu consigo fazer todas as minhas atividades de diversao com alguma dor no pescoco.","Eu consigo fazer a maioria das atividades de diversao, mas nao todas, por causa da dor.","Eu consigo fazer poucas das minhas atividades de diversao por causa da dor no pescoco.","Eu mal consigo fazer quaisquer atividades de diversao por causa da dor no pescoco.","Eu nao consigo fazer nenhuma atividade de diversao."],na:false}
];

var answers={};
var patientAge=null;
var current=0;
var screen='name';
var patientName='';

function calcScore(){
var total=0,maxPts=0;
sections.forEach(function(s){
var a=answers[s.id];
if(a===undefined||a==='na')return;
total+=a;maxPts+=5;
});
return{total:total,maxPts:maxPts,pct:maxPts>0?Math.round((total/maxPts)*100):0};
}

function getClass(pct){
if(pct<10)return{label:"Sem incapacidade significativa",cls:"class-none",nivel:"sem_incapacidade"};
if(pct<=28)return{label:"Incapacidade leve",cls:"class-leve",nivel:"leve"};
if(pct<=48)return{label:"Incapacidade moderada",cls:"class-moderada",nivel:"moderada"};
if(pct<=68)return{label:"Incapacidade severa",cls:"class-severa",nivel:"severa"};
return{label:"Incapacidade completa",cls:"class-completa",nivel:"completa"};
}

function barColor(pts){
if(pts<=1)return'#1D9E75';
if(pts<=2)return'#BA7517';
if(pts<=3)return'#D85A30';
return'#E24B4A';
}

function escHtml(str){
return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function selectOption(sid,val){
answers[sid]=val;
render();
}

function enviarResultado(){
var sc=calcScore();
var cl=getClass(sc.pct);
var today=new Date().toLocaleDateString('pt-BR');
var loading=document.getElementById('loading');
var loadingTxt=document.getElementById('loading-txt');
if(loading){loading.classList.add('show');}
if(loadingTxt){loadingTxt.textContent='Enviando para nuvem...';}
var respostasDetalhadas={};
sections.forEach(function(s){
  var a=answers[s.id];
  respostasDetalhadas['s'+s.id]={
    titulo: s.title,
    pontos: (a===undefined||a==='na')?null:(typeof a==='number'?a:null),
    na: a==='na'
  };
});
var dados={
  nome: patientName||'Anonimo',
  idade: patientAge||null,
  data: today,
  pontuacao_total: sc.total,
  pontuacao_maxima: sc.maxPts,
  percentual: sc.pct,
  nivel: cl.nivel,
  classificacao: cl.label,
  respostas: respostasDetalhadas
};
var salvar = window.salvarNoFirebase ? window.salvarNoFirebase(dados) : Promise.resolve(false);
salvar.then(function(ok) {
  if(loading){loading.classList.remove('show');}
  var msg=document.getElementById('msg-firebase');
  if(msg){
    if(ok){
      msg.className='msg-box msg-ok';
      msg.textContent='Resultado enviado para o painel em tempo real!';
    } else {
      msg.className='msg-box msg-err';
      msg.textContent='Nao foi possivel enviar. Verifique a conexao.';
    }
    msg.style.display='block';
    setTimeout(function(){msg.style.display='none';},4000);
  }
}).catch(function() {
  if(loading){loading.classList.remove('show');}
  var msg=document.getElementById('msg-firebase');
  if(msg){
    msg.className='msg-box msg-err';
    msg.textContent='Nao foi possivel enviar. Verifique a conexao.';
    msg.style.display='block';
    setTimeout(function(){msg.style.display='none';},4000);
  }
});
}

function render(){
var app=document.getElementById('app');

if(screen==='name'){
app.innerHTML='<div class="header"><img class="project-logo" src="'+LOGO_SRC+'" alt="Logo do Projeto"><h1>Indice de Incapacidade<br>Relacionada ao Pescoco</h1><p>Neck Disability Index (NDI)</p>'
+'<div class="fb-badge"><span class="fb-dot"></span>Conectado ao painel ao vivo</div></div>'
+'<div class="card"><div class="section-title" style="margin-bottom:10px">Nome do paciente</div>'
+'<input class="name-input" id="name-field" type="text" placeholder="Digite o nome aqui..." value="'+escHtml(patientName)+'">'
+'<div class="section-title" style="margin-bottom:6px;margin-top:12px">Idade</div>'
+'<input class="name-input" id="age-field" type="number" min="0" max="120" placeholder="Digite a idade..." value="'+escHtml(String(patientAge||''))+'">'
+'<p style="font-size:13px;color:#888;margin-top:8px">Este questionario tem 10 secoes. Marque apenas uma alternativa por secao.</p></div>'
+'<button class="btn btn-primary" style="width:100%;padding:13px;font-size:15px" onclick="patientName=document.getElementById(\'name-field\').value;patientAge=parseInt(document.getElementById(\'age-field\').value)||null;screen=\'quiz\';current=0;render()">Iniciar questionario</button>';
return;
}

if(screen==='quiz'){
var s=sections[current];
var sel=answers[s.id];
var answered=Object.keys(answers).length;
var pct=Math.round((answered/10)*100);
var isLast=current===sections.length-1;
var allAnswered=sections.every(function(sc){return answers[sc.id]!==undefined;});

var opts='';
s.options.forEach(function(o,i){
var isSel=sel===i;
opts+='<div class="option'+(isSel?' selected':'')+'" onclick="selectOption('+s.id+','+i+')">'
+'<input type="radio" name="s'+s.id+'" '+(isSel?'checked':'')+' onclick="selectOption('+s.id+','+i+')">'
+'<label>'+escHtml(o)+'</label></div>';
});
if(s.na){
var isNA=sel==='na';
opts+='<div class="option'+(isNA?' selected':'')+'" onclick="selectOption('+s.id+',\'na\')">'
+'<input type="radio" name="s'+s.id+'" '+(isNA?'checked':'')+'>'
+'<label style="color:#888">'+escHtml(s.naText)+'</label></div>';
}

var navBtns='<div class="nav-btns">';
if(current>0)navBtns+='<button class="btn" onclick="current--;render()">← Anterior</button>';
if(!isLast)navBtns+='<button class="btn btn-primary" '+(sel!==undefined?'':'disabled')+' onclick="if(answers['+s.id+']!==undefined){current++;render()}">Proxima →</button>';
if(isLast)navBtns+='<button class="btn btn-primary" '+((sel!==undefined&&allAnswered)?'':'disabled')+' onclick="screen=\'result\';render()">Ver resultado</button>';
navBtns+='</div>';

app.innerHTML='<div class="quiz-logo-bar"><img src="'+LOGO_SRC+'" alt="Logo do Projeto"></div>'
+'<div class="header"><h1>Indice NDI</h1><p>'+escHtml(patientName||'Paciente')+'</p></div>'
+'<div class="progress-text">'+answered+' de 10 secoes respondidas</div>'
+'<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
+'<div class="card"><div class="section-num">Secao '+s.id+' de 10</div>'
+'<div class="section-title">'+escHtml(s.title)+'</div>'+opts+'</div>'+navBtns;
return;
}

if(screen==='result'){
var sc=calcScore();
var cl=getClass(sc.pct);
var today=new Date().toLocaleDateString('pt-BR');
var bars='';
sections.forEach(function(s){
var a=answers[s.id];
var pts=(a===undefined||a==='na')?null:a;
var w=pts!==null?Math.round((pts/5)*100):0;
var color=pts!==null?barColor(pts):'#ccc';
bars+='<div class="bar-row"><span class="bar-lbl">S'+s.id+'</span>'
+'<div class="bar-track"><div class="bar-fill" style="width:'+w+'%;background:'+color+'"></div></div>'
+'<span class="bar-pts">'+(pts!==null?pts:'N/A')+'</span></div>';
});
var details='';
sections.forEach(function(s){
var a=answers[s.id];
var pts=a===undefined?'--':a==='na'?'N/A':a;
details+='<div class="detail-row"><span style="color:#888">S'+s.id+' - '+escHtml(s.title)+'</span><span style="font-weight:600">'+pts+'</span></div>';
});
app.innerHTML='<div class="header"><img class="project-logo" src="'+LOGO_SRC+'" alt="Logo do Projeto"><h1>Resultado NDI</h1><p>'+escHtml(patientName||'Paciente')+' - '+today+'</p>'
+'<div class="fb-badge"><span class="fb-dot"></span>Conectado ao painel ao vivo</div></div>'
+'<div class="metric-grid"><div class="metric"><div class="metric-val">'+sc.pct+'%</div><div class="metric-lbl">Incapacidade</div></div>'
+'<div class="metric"><div class="metric-val">'+sc.total+'/'+sc.maxPts+'</div><div class="metric-lbl">Pontos</div></div></div>'
+'<div class="result-class '+cl.cls+'">'+cl.label+'</div>'
+'<div class="card"><div class="section-title" style="margin-bottom:12px">Pontuacao por secao</div>'+bars
+'<div class="legend"><span><span class="leg-dot" style="background:#1D9E75"></span>0-1 pts</span>'
+'<span><span class="leg-dot" style="background:#BA7517"></span>2 pts</span>'
+'<span><span class="leg-dot" style="background:#D85A30"></span>3 pts</span>'
+'<span><span class="leg-dot" style="background:#E24B4A"></span>4-5 pts</span></div></div>'
+'<div class="card"><div class="section-title" style="margin-bottom:8px">Detalhe por secao</div>'+details+'</div>'
+'<div id="msg-firebase" class="msg-box"></div>'
+'<button class="save-img-btn" onclick="enviarResultado()">Enviar para o painel ao vivo</button>'
+'<button class="restart-btn" onclick="answers={};current=0;screen=\'name\';patientName=\'\';patientAge=null;render()" style="margin-top:8px">Novo questionario</button>'
+'<div style="height:1.5rem"></div>';
setTimeout(function(){ enviarResultado(); }, 500);
}
}

render();
</script>
</body>
</html>
